<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<meta name="theme-color" content="#EDEEE9">
<title>筋トレ記録</title>
<style>
:root{
  --chalk:#EDEEE9; --paper:#FBFBF8; --line:#D3D6CC; --ink:#22292E; --ink2:#5F6870; --ink3:#9AA3A9;
  --plate-blue:#2456A4; --plate-blue-dk:#1B438A; --plate-red:#B8343A; --plate-green:#2E7D4F; --plate-yellow:#E0B429;
  --radius:14px; --tap:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--chalk);color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.screen{display:none;padding:12px 16px 24px;max-width:560px;margin:0 auto}
.screen.active{display:block}
h1{font-size:22px;font-weight:700;margin:8px 0 14px;letter-spacing:.01em}
h2{font-size:14px;font-weight:600;color:var(--ink2);margin:20px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--plate-blue);font-weight:600;min-height:44px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card+.card{margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:var(--tap);border-radius:var(--radius);
  font-weight:700;font-size:17px;padding:0 18px;width:100%}
.btn.primary{background:var(--plate-blue);color:#fff}
.btn.primary:active{background:var(--plate-blue-dk)}
.btn.ghost{background:var(--paper);border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--paper);border:1.5px solid var(--plate-red);color:var(--plate-red)}
.btn[disabled]{opacity:.45}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.faint{color:var(--ink3)}
/* 今日 */
.datebar{display:flex;align-items:baseline;gap:10px}
.datebar input{border:0;background:transparent;font-size:22px;font-weight:700;padding:0;color:var(--ink);width:auto}
.today-group{padding:12px 0;border-top:1px solid var(--line)}
.today-group:first-child{border-top:0}
.today-group .name{font-weight:700;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chalk);border-radius:8px;padding:3px 9px;font-size:14px}
.chip.today{background:#E3EAF6;color:var(--plate-blue-dk);font-weight:600}
.empty{text-align:center;color:var(--ink2);padding:36px 12px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
/* 種目選択 */
.search{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--paper);font-size:17px;-webkit-appearance:none}
.parts{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.parts::-webkit-scrollbar{display:none}
.part{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;min-height:40px}
.part.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 16px;min-height:56px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:600;font-size:17px}
.item .sub{font-size:12px;color:var(--ink3)}
.item .last{font-size:14px;color:var(--ink2);text-align:right;flex:none}
/* セット入力 */
.prev{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prev .lbl{font-size:13px;color:var(--ink2)}
.prev .sets{font-size:19px;font-weight:600;margin-top:2px;letter-spacing:.01em}
.prev .best{font-size:13px;color:var(--ink2);text-align:right}
.prev .best b{display:block;font-size:17px;color:var(--ink)}
.stepper{margin-top:10px}
.stepper .lbl{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.stepper .ctrl{display:flex;align-items:center;gap:6px;margin-top:6px}
.stepper .val{flex:1;text-align:center;font-size:44px;font-weight:800;border:0;background:transparent;width:100%;min-width:0;padding:0;line-height:1.1}
.stepper .val::-webkit-inner-spin-button{display:none}
.stepper .unit{font-size:16px;color:var(--ink2);font-weight:600;margin-left:-4px}
.sbtn{flex:none;width:56px;height:56px;border-radius:12px;background:var(--chalk);border:1.5px solid var(--line);font-size:18px;font-weight:700}
.sbtn:active{background:#DFE2D9}
.sbtn.big{background:#E3EAF6;border-color:#C6D3EA;color:var(--plate-blue-dk)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);min-height:32px}
.toggle input{width:18px;height:18px}
.memo{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper);font-size:15px;margin-top:10px;-webkit-appearance:none}
.setlist{margin-top:10px}
.setrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .n{width:34px;color:var(--ink3);font-size:13px}
.setrow .v{flex:1;font-weight:600;font-size:17px}
.setrow .m{color:var(--ink2);font-size:13px}
.del{width:40px;height:40px;border-radius:10px;color:var(--plate-red);font-size:20px;flex:none}
/* 書き出し */
.count{font-size:40px;font-weight:800;line-height:1.1}
.count small{font-size:15px;font-weight:600;color:var(--ink2);margin-left:4px}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{position:relative;padding:8px 0 8px 32px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;background:var(--chalk);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps .btn{margin-top:8px;min-height:44px;font-size:15px}
.hidden{display:none!important}
textarea.raw{width:100%;height:120px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:12px;font-family:ui-monospace,Menlo,monospace;background:var(--paper)}
/* 設定 */
.field{margin-top:10px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.field input,.field select{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper);-webkit-appearance:none}
.mrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .nm{flex:1;font-weight:600}
.mrow .pt{font-size:13px;color:var(--ink2);width:40px}
/* ナビ */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);min-height:48px;font-weight:600}
nav button.on{color:var(--plate-blue)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;margin-left:28px;margin-top:-2px;background:var(--plate-red);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}
/* トースト */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
:focus-visible{outline:2px solid var(--plate-blue);outline-offset:2px}
/* 分析 */
.tabs{display:flex;gap:6px;margin:4px 0 10px}
.tab{flex:1;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:14px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.periods{display:flex;gap:6px;margin-bottom:10px}
.periods .part{flex:1;text-align:center;padding:6px 0;min-height:36px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.kpi span{font-size:11px;color:var(--ink2)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:inherit;font-size:11px;fill:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:11px;color:var(--ink3);padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:10px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--ink2)}
.cal .d.out{opacity:.25;border-style:dashed}
.cal .d.hit{background:#DCEFE2;border-color:#A9D6B8;color:var(--ink);font-weight:700}
.cal .d.hit::after{content:"💪";font-size:15px;line-height:1.1}
.cal .d.today{outline:2px solid var(--plate-blue);outline-offset:-2px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calnav b{font-size:17px}
.calnav button{width:44px;height:40px;font-size:20px;color:var(--plate-blue)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.pr{color:var(--plate-red);font-weight:700;font-size:11px;margin-left:4px}
select.wide{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper);-webkit-appearance:none;font-size:16px;font-weight:600}
.banner{background:#FBF3D6;border:1px solid #E8D48A;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.banner b{display:block;margin-bottom:6px}
.banner .btn{min-height:44px;font-size:15px}
details.ex summary{cursor:pointer;font-weight:600;color:var(--ink2);padding:6px 0;list-style:none}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::before{content:"▸ ";color:var(--ink3)}
details.ex[open] summary::before{content:"▾ "}
.body-card{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.body-card .v{font-size:22px;font-weight:800}
.body-card .v small{font-size:13px;font-weight:600;color:var(--ink2);margin-left:2px}
.body-form{margin-bottom:10px}
.mini .val{font-size:30px}
.mini .sbtn{width:48px;height:48px;font-size:15px}
.mrow{cursor:pointer}
.mrow .arrow{color:var(--ink3)}
.mrow.hid{opacity:.5}
</style>
</head>
<body>

<!-- 今日 -->
<section class="screen active" id="s-home">
  <div class="top">
    <div class="datebar"><input type="date" id="date"></div>
    <div class="small muted num" id="home-stat"></div>
  </div>
  <div id="home-banner"></div>
  <div id="body-card"></div>
  <div id="home-list"></div>
  <div style="margin-top:14px"><button class="btn primary" onclick="openPicker()">種目を選ぶ</button></div>
</section>

<!-- 種目選択 -->
<section class="screen" id="s-pick">
  <div class="top"><button class="back" onclick="go('home')">‹ 今日</button><span class="small muted" id="pick-date"></span></div>
  <input class="search" id="q" type="search" placeholder="種目名で検索" autocomplete="off" oninput="renderPicker()">
  <div class="parts" id="parts"></div>
  <div id="pick-list"></div>
</section>

<!-- セット入力 -->
<section class="screen" id="s-entry">
  <div class="top"><button class="back" onclick="go('home')">‹ 今日</button><span class="small muted" id="entry-part"></span></div>
  <h1 id="entry-name"></h1>
  <div class="card">
    <div class="prev">
      <div class="grow"><div class="lbl" id="prev-lbl">前回</div><div class="sets num" id="prev-sets"></div></div>
      <div class="best"><span>自己ベスト</span><b class="num" id="prev-best"></b></div>
    </div>
  </div>
  <div class="card" style="margin-top:10px">
    <div class="stepper">
      <div class="lbl"><span>重量</span><label class="toggle"><input type="checkbox" id="bw" onchange="toggleBW()">自重</label></div>
      <div class="ctrl" id="wctrl">
        <button class="sbtn big" onclick="stepW(-2.5)">−2.5</button><button class="sbtn" onclick="stepW(-0.5)">−0.5</button>
        <input class="val num" id="w" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0"><span class="unit">kg</span>
        <button class="sbtn" onclick="stepW(0.5)">+0.5</button><button class="sbtn big" onclick="stepW(2.5)">+2.5</button>
      </div>
    </div>
    <div class="stepper">
      <div class="lbl"><span>回数</span></div>
      <div class="ctrl">
        <button class="sbtn big" onclick="stepR(-1)">−1</button>
        <input class="val num" id="r" type="number" inputmode="numeric" step="1" min="0" placeholder="0"><span class="unit">回</span>
        <button class="sbtn big" onclick="stepR(1)">+1</button>
      </div>
    </div>
    <input class="memo" id="memo" type="text" placeholder="メモ（任意）" autocomplete="off">
    <div style="margin-top:12px"><button class="btn primary" id="add" onclick="addSet()">セットを追加</button></div>
  </div>
  <h2>今日のセット</h2>
  <div class="card setlist" id="today-sets"></div>
</section>

<!-- 書き出し -->
<section class="screen" id="s-analysis">
  <h1>分析</h1>
  <div class="tabs">
    <button class="tab" data-t="cal" onclick="aTab('cal')">カレンダー</button>
    <button class="tab" data-t="trend" onclick="aTab('trend')">推移</button>
    <button class="tab" data-t="ex" onclick="aTab('ex')">種目別</button>
    <button class="tab" data-t="body" onclick="aTab('body')">体重</button>
    <button class="tab" data-t="ai" onclick="aTab('ai')">AI用</button>
  </div>
  <div id="a-body"></div>
</section>

<section class="screen" id="s-export">
  <h1>保存</h1>
  <div class="card">
    <div class="small muted" id="bk-info"></div>
    <div style="height:10px"></div>
    <button class="btn primary" onclick="backupJSON()">バックアップを保存</button>
    <p class="small muted" style="margin:8px 0 0">共有シートで「ファイルに保存」→ OneDrive のフォルダを選ぶ。ファイル名に日付が付くので上書きの心配はありません。</p>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="document.getElementById('file').click()">バックアップから復元</button>
    <input type="file" id="file" accept=".json,application/json" class="hidden" onchange="restoreJSON(this)">
    <div style="height:8px"></div>
    <button class="btn ghost" onclick="shareCSV()">筋トレ記録をCSVで共有（Excel等で見る用）</button>
  </div>
  <div class="card" style="margin-top:10px">
    <button class="btn ghost" onclick="shareBodyCSV()">体重記録をCSVで共有</button>
  </div>
</section>

<!-- 設定 -->
<section class="screen" id="s-settings">
  <h1>種目</h1>
  <div class="card">
    <div class="field"><label>種目名</label><input id="m-name" type="text" placeholder="例：チェストプレス" autocomplete="off"></div>
    <div class="row">
      <div class="field grow"><label>部位</label><select id="m-part"></select></div>
      <div class="field grow"><label>重量の入れ方</label><select id="m-unit"><option>総重量</option><option>片手重量</option><option>自重</option><option>補助あり</option><option>その他</option></select></div>
    </div>
    <div style="margin-top:12px"><button class="btn primary" onclick="addMaster()">種目を追加</button></div>
  </div>
  <div class="card hidden" style="margin-top:10px" id="m-detail"></div>
  <p class="small muted" style="margin:10px 0 6px">種目をタップすると、部位・重量の入れ方の変更と削除ができます。</p>
  <div class="card" id="m-list"></div>
  <h2>体重</h2>
  <div class="card">
    <div class="field"><label>身長（cm）BMIの計算に使う</label><input id="height" type="number" inputmode="decimal" step="0.1" placeholder="例：172.5" onchange="saveHeight(this.value)"></div>
  </div>
  <h2>データ</h2>
  <div class="card"><div class="small muted num" id="stat"></div></div>
</section>

<nav>
  <button id="n-home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>今日</button>
  <button id="n-analysis" onclick="go('analysis')"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-6 3 3 5-7"/></svg>分析</button>
  <button id="n-export" onclick="go('export')"><span class="badge hidden" id="nbadge">!</span><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>保存</button>
  <button id="n-settings" onclick="go('settings')"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>種目</button>
</nav>

const KEY = 'gymlog.v1';
const PARTS = ['脚','背中','胸','肩','腕','その他'];

let db = load();
let state = { screen:'home', date: todayStr(), part:'全て', name:null, aTab:'cal', weeks:12, calYM:todayStr().slice(0,7), aName:null };

function load(){
  try{ const s = localStorage.getItem(KEY); if(s){ const d = JSON.parse(s); if(d && d.records && d.master){ d.meta = d.meta||{}; d.body = d.body||[]; return d; } } }catch(e){}
  const d = { master: SEED.master.map(m=>({...m})), records: SEED.records.map((r,i)=>({id:'seed'+i, ...r})), meta:{}, body:[] };
  save(d); return d;
}
function save(d){ localStorage.setItem(KEY, JSON.stringify(d||db)); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function md(s){ const [y,m,d]=s.split('-'); return (+m)+'/'+(+d); }
function ymd(s){ const [y,m,d]=s.split('-'); return y+'/'+(+m)+'/'+(+d); }
function fmtW(w){ return (w===null||w===undefined||w==='')?'自重':(+w)+'kg'; }
function setStr(r){ return (r.weight===null||r.weight===undefined||r.weight==='') ? r.reps+'回' : (+r.weight)+'×'+r.reps; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1400); }
function masterOf(name){ return db.master.find(m=>m.name===name); }
function sortJa(arr){ return arr.sort((a,b)=>a.localeCompare(b,'ja')); }

// ---- 前回実績 ----
function lastSession(name, before){
  const rs = db.records.filter(r=>r.name===name && r.date<before);
  if(!rs.length) return null;
  const d = rs.reduce((m,r)=>r.date>m?r.date:m, '');
  return { date:d, sets: rs.filter(r=>r.date===d) };
}
function topSet(sets){
  const w = Math.max(...sets.map(s=>+s.weight||0));
  const reps = Math.max(...sets.filter(s=>(+s.weight||0)===w).map(s=>+s.reps||0));
  return {weight: w, reps};
}
function best(name){
  const rs = db.records.filter(r=>r.name===name && (+r.weight||0)>0);
  if(!rs.length) return null;
  return topSet(rs);
}

// ---- 画面遷移 ----
function go(s){
  state.screen = s;
  document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active', el.id==='s-'+s));
  ['home','analysis','export','settings'].forEach(k=>document.getElementById('n-'+k).classList.toggle('on', s===k || (k==='home'&&(s==='pick'||s==='entry'))));
  if(s==='home') renderHome(); if(s==='pick') renderPicker(); if(s==='entry') renderEntry(); if(s==='analysis') renderAnalysis(); if(s==='export') renderExport(); if(s==='settings') renderSettings();
  window.scrollTo(0,0);
}

// ---- 今日 ----
function renderHome(){
  document.getElementById('date').value = state.date;
  renderBanner(); renderBodyCard();
  const rs = db.records.filter(r=>r.date===state.date);
  const groups = [];
  rs.forEach(r=>{ let g=groups.find(g=>g.name===r.name); if(!g){g={name:r.name,sets:[]};groups.push(g);} g.sets.push(r); });
  const vol = rs.reduce((a,r)=>a+((+r.weight||0)*(+r.reps||0)),0);
  document.getElementById('home-stat').textContent = rs.length? rs.length+'セット / '+Math.round(vol).toLocaleString()+'kg' : '';
  const el = document.getElementById('home-list');
  if(!groups.length){ el.innerHTML = '<div class="empty"><b>まだ記録がありません</b>種目を選んで、1セット目から</div>'; return; }
  el.innerHTML = '<div class="card">'+groups.map(g=>`
    <button class="today-group" style="display:block;width:100%;text-align:left" onclick="openEntry('${esc(g.name)}')">
      <div class="row"><span class="name grow">${esc(g.name)}</span><span class="small muted">${g.sets.length}セット</span></div>
      <div class="chips num">${g.sets.map(s=>'<span class="chip today">'+setStr(s)+'</span>').join('')}</div>
    </button>`).join('')+'</div>';
}
document.getElementById('date').addEventListener('change', e=>{ state.date = e.target.value || todayStr(); state.bodyEdit=false; renderHome(); });
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ---- 種目選択 ----
function openPicker(){ document.getElementById('q').value=''; go('pick'); }
function renderPicker(){
  document.getElementById('pick-date').textContent = ymd(state.date);
  const pe = document.getElementById('parts');
  pe.innerHTML = ['全て',...PARTS].map(p=>`<button class="part ${state.part===p?'on':''}" onclick="state.part='${p}';renderPicker()">${p}</button>`).join('');
  const q = document.getElementById('q').value.trim();
  let names = db.master.filter(m=>!m.hidden && (state.part==='全て'||m.part===state.part)).map(m=>m.name);
  if(q) names = names.filter(n=>n.includes(q));
  sortJa(names);
  // 最近やった種目（直近3回のトレーニング日）
  const dates = [...new Set(db.records.map(r=>r.date))].sort().reverse().slice(0,3);
  const recent = [...new Set(db.records.filter(r=>dates.includes(r.date)).map(r=>r.name))].filter(n=>names.includes(n));
  const row = n=>{
    const m = masterOf(n)||{}; const ls = lastSession(n, '9999');
    const last = ls ? setStr(topSet(ls.sets))+'<br><span class="sub">'+md(ls.date)+'</span>' : '<span class="sub">未実施</span>';
    return `<button class="item" onclick="openEntry('${esc(n)}')"><div class="grow"><div class="nm">${esc(n)}</div><div class="sub">${esc(m.part||'')}${m.unit&&m.unit!=='総重量'?' ・ '+esc(m.unit):''}</div></div><div class="last num">${last}</div></button>`;
  };
  let html = '';
  if(!q && recent.length){ html += '<h2>最近やった</h2><div class="list">'+recent.map(row).join('')+'</div>'; }
  html += '<h2>'+(state.part==='全て'?'全種目':state.part)+'（あいうえお順）</h2>';
  html += names.length ? '<div class="list">'+names.map(row).join('')+'</div>' : '<div class="empty">該当する種目がありません。「種目」タブから追加できます</div>';
  document.getElementById('pick-list').innerHTML = html;
}

// ---- セット入力 ----
function openEntry(name){ state.name = name; go('entry'); }
function renderEntry(){
  const name = state.name; const m = masterOf(name)||{};
  document.getElementById('entry-name').textContent = name;
  const bwRec = bodyBefore(state.date);
  document.getElementById('entry-part').textContent = (m.part||'')+(m.unit?'・'+m.unit:'')+((m.unit==='自重'&&bwRec)?'・体重'+bwRec.weight+'kg':'');
  const ls = lastSession(name, state.date);
  document.getElementById('prev-lbl').textContent = ls ? '前回 '+ymd(ls.date) : '前回';
  document.getElementById('prev-sets').innerHTML = ls ? ls.sets.map(setStr).join(' <span class="faint">/</span> ') : '<span class="faint">初めての種目</span>';
  const b = best(name);
  document.getElementById('prev-best').textContent = b ? b.weight+'kg×'+b.reps : '—';
  // 初期値：今日の最後のセット → 前回のトップセット
  const today = db.records.filter(r=>r.date===state.date && r.name===name);
  const src = today.length ? today[today.length-1] : (ls ? topSet(ls.sets) : null);
  const bw = document.getElementById('bw');
  const isBW = src ? !(+src.weight>0) && (m.unit==='自重' || src.weight===null||src.weight===undefined||src.weight==='') : (m.unit==='自重');
  bw.checked = isBW;
  document.getElementById('w').value = (src && +src.weight>0) ? +src.weight : '';
  document.getElementById('r').value = src ? (src.reps||'') : '';
  document.getElementById('memo').value = '';
  toggleBW();
  renderTodaySets();

// ---- 分析 ----
const PART_COLORS = {脚:'#2456A4',背中:'#2E7D4F',胸:'#B8343A',肩:'#E0B429',腕:'#7B4FA6',その他:'#9AA3A9'};
function partOf(n){ const m=masterOf(n); return (m&&m.part)||'その他'; }
function e1rm(w,r){ return (w>0&&r>0)? Math.round(w*(1+r/30)*10)/10 : 0; }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekStart(s){ const d=new Date(s+'T00:00:00'); const k=(d.getDay()+6)%7; return addDays(s,-k); }
function periodFrom(){ return state.weeks? addDays(weekStart(todayStr()), -(state.weeks-1)*7) : '0000-00-00'; }
function periodRecs(){ const f=periodFrom(); return db.records.filter(r=>r.date>=f && r.date<=todayStr()); }
function sessionsOf(name, recs){
  const by={}; (recs||db.records).filter(r=>r.name===name).forEach(r=>{ (by[r.date]=by[r.date]||[]).push(r); });
  return Object.keys(by).sort().map(d=>{ const sets=by[d]; const top=topSet(sets);
    return { date:d, sets, top, volume:sets.reduce((a,r)=>a+(+r.weight||0)*(+r.reps||0),0), e1:Math.max(...sets.map(s=>e1rm(+s.weight||0,+s.reps||0))) }; });
}

function setWeeks(w){ state.weeks=w; renderAnalysis(); }
function periodChips(){ return '<div class="periods">'+[[4,'4週'],[12,'12週'],[26,'26週'],[0,'全期間']].map(([w,l])=>`<button class="part ${state.weeks===w?'on':''}" onclick="setWeeks(${w})">${l}</button>`).join('')+'</div>'; }
function fmtKg(v){ return Math.round(v).toLocaleString(); }
// SVG helpers
function svgBars(vals, labels, color){
  const W=360,H=170,pl=36,pr=8,pt=14,pb=22, n=vals.length||1, max=Math.max(...vals,1), bw=(W-pl-pr)/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  s+=`<text x="${pl-4}" y="${pt+4}" text-anchor="end">${fmtKg(max)}</text><text x="${pl-4}" y="${H-pb}" text-anchor="end">0</text><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#D3D6CC"/>`;
  vals.forEach((v,i)=>{ const h=(v/max)*(H-pt-pb); s+=`<rect x="${pl+i*bw+1}" y="${H-pb-h}" width="${Math.max(bw-2,1)}" height="${h}" rx="2" fill="${color}"/>`; });
  [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{ if(labels[i]) s+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`; });
  return s+'</svg>';
}
function svgStacked(rows, labels){
  const W=360,H=170,pl=30,pr=8,pt=14,pb=22, n=rows.length||1, max=Math.max(...rows.map(r=>Object.values(r).reduce((a,b)=>a+b,0)),1), bw=(W-pl-pr)/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="${pl-4}" y="${pt+4}" text-anchor="end">${max}</text><text x="${pl-4}" y="${H-pb}" text-anchor="end">0</text><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#D3D6CC"/>`;
  rows.forEach((r,i)=>{ let y=H-pb; PARTS.forEach(p=>{ const v=r[p]||0; if(!v) return; const h=v/max*(H-pt-pb); y-=h; s+=`<rect x="${pl+i*bw+1}" y="${y}" width="${Math.max(bw-2,1)}" height="${h}" fill="${PART_COLORS[p]}"/>`; }); });
  [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{ if(labels[i]) s+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`; });
  return s+'</svg>';
}
function svgLines(series, labels){
  const W=360,H=170,pl=36,pr=8,pt=14,pb=22, n=labels.length, all=series.flatMap(x=>x.vals).filter(v=>v>0);
  const max=Math.max(...all,1), min=Math.min(...all,max), lo=Math.max(0,min-(max-min)*0.2), hi=max+(max-min)*0.1||max*1.1;
  const x=i=>pl+(n<2?0:(i/(n-1))*(W-pl-pr)), y=v=>pt+(1-(v-lo)/(hi-lo||1))*(H-pt-pb);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="${pl-4}" y="${pt+4}" text-anchor="end">${Math.round(hi)}</text><text x="${pl-4}" y="${H-pb}" text-anchor="end">${Math.round(lo)}</text><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#D3D6CC"/>`;
  series.forEach(se=>{ const pts=se.vals.map((v,i)=>v>0?[x(i),y(v)]:null).filter(Boolean); if(pts.length) s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${se.color}"/>`).join(''); });
  [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{ if(labels[i]) s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`; });
  return s+'</svg>';
}

function viewCal(){

  const recs=db.records.filter(r=>r.date.startsWith(state.calYM)); const hit=new Set(recs.map(r=>r.date));

  <div class="kpis"><div class="kpi"><b class="num">${hit.size}</b><span>トレーニング日</span></div><div class="kpi"><b class="num">${recs.length}</b><span>セット</span></div><div class="kpi"><b class="num">${fmtKg(vol)}</b><span>ボリュームkg</span></div></div>
  <div class="cal">${['日','月','火','水','木','金','土'].map(d=>'<div class="dow">'+d+'</div>').join('')}${cells}</div>`;

function weekRows(recs){
  const from = state.weeks ? periodFrom() : weekStart(recs.length? recs.map(r=>r.date).sort()[0] : todayStr());
  const rows=[]; for(let w=from; w<=todayStr(); w=addDays(w,7)) rows.push({start:w, recs:recs.filter(r=>r.date>=w && r.date<addDays(w,7))});
  return rows;
}
function viewTrend(){
  const recs=periodRecs(); if(!recs.length) return '<div class="empty"><b>この期間の記録がありません</b></div>';
  const rows=weekRows(recs); const labels=rows.map(r=>md(r.start));
  const wv=rows.map(r=>r.recs.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0));
  let cum=0; const cv=rows.map((r,i)=>cum+=wv[i]);
  const ps=rows.map(r=>{ const o={}; r.recs.forEach(x=>{ const p=partOf(x.name); o[p]=(o[p]||0)+1; }); return o; });
  const days=new Set(recs.map(r=>r.date)).size;
  return `<div class="kpis"><div class="kpi"><b class="num">${days}</b><span>トレーニング日</span></div><div class="kpi"><b class="num">${(days/rows.length).toFixed(1)}</b><span>週あたり日数</span></div><div class="kpi"><b class="num">${fmtKg(cum)}</b><span>ボリュームkg</span></div></div>
  <div class="card"><h2 style="margin:0 0 6px">週別ボリューム</h2>${svgBars(wv,labels,'#2456A4')}</div>
  <div class="card"><h2 style="margin:0 0 6px">累積ボリューム</h2>${svgLines([{vals:cv,color:'#2E7D4F'}],labels)}</div>
  <div class="card"><h2 style="margin:0 0 6px">週別セット数（部位別）</h2>${svgStacked(ps,labels)}<div class="legend">${PARTS.map(p=>`<span><i style="background:${PART_COLORS[p]}"></i>${p}</span>`).join('')}</div></div>`;
}
function viewEx(){
  const names=sortJa(db.master.map(m=>m.name));
  if(!state.aName){ const last=db.records.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]; state.aName = last? last.name : names[0]; }
  const sel=`<select class="wide" onchange="state.aName=this.value;renderAnalysis()">${names.map(n=>`<option ${n===state.aName?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
  const ss=sessionsOf(state.aName, periodRecs()); const all=sessionsOf(state.aName);
  if(!ss.length) return sel+'<div class="empty"><b>この期間の記録がありません</b></div>';
  const b=best(state.aName); const bestE=Math.max(...all.map(s=>s.e1));
  let prMax=0; const pr=new Set(); all.forEach(s=>{ if(s.top.weight>prMax){ prMax=s.top.weight; pr.add(s.date); } });
  const labels=ss.map(s=>md(s.date));
  const chart = b ? svgLines([{vals:ss.map(s=>s.top.weight),color:'#2456A4'},{vals:ss.map(s=>s.e1),color:'#E0B429'}],labels)+'<div class="legend"><span><i style="background:#2456A4"></i>トップセット重量</span><span><i style="background:#E0B429"></i>推定1RM</span></div>'
                 : svgLines([{vals:ss.map(s=>s.top.reps),color:'#2456A4'}],labels)+'<div class="legend"><span><i style="background:#2456A4"></i>最大回数（自重）</span></div>';
  const tbl=ss.slice().reverse().slice(0,20).map(s=>`<tr><td class="num">${md(s.date)}${pr.has(s.date)&&s.top.weight>0?'<span class="pr">PR</span>':''}</td><td class="num">${s.sets.map(setStr).join(' / ')}</td><td class="r num">${fmtKg(s.volume)}</td></tr>`).join('');
  return sel+`<div class="kpis" style="margin-top:10px"><div class="kpi"><b class="num">${b?b.weight+'<small style="font-size:12px">kg</small>':'—'}</b><span>自己ベスト${b?'×'+b.reps:''}</span></div><div class="kpi"><b class="num">${bestE>0?bestE:'—'}</b><span>推定1RM最高</span></div><div class="kpi"><b class="num">${ss.length}</b><span>セッション</span></div></div>
  <div class="card"><h2 style="margin:0 0 6px">セッションごとの推移</h2>${chart}</div>
  <div class="card" style="margin-top:10px"><table class="tbl"><tr><th>日付</th><th>セット</th><th class="r">kg</th></tr>${tbl}</table></div>`;
}
function buildSummary(){
  const recs=periodRecs(); if(!recs.length) return '（この期間の記録がありません）';
  const rows=weekRows(recs); const days=[...new Set(recs.map(r=>r.date))].sort();
  const vol=recs.reduce((a,r)=>a+(+r.weight||0)*(+r.reps||0),0);
  const parts={}; recs.forEach(r=>{ const p=partOf(r.name); parts[p]=(parts[p]||0)+1; });
  const names=[...new Set(recs.map(r=>r.name))];
  const exRows=names.map(n=>{ const ss=sessionsOf(n,recs); const b=best(n); const f=ss[0].top, l=ss[ss.length-1].top;
    return [n, partOf(n), ss.length, setStr(f), setStr(l), b?b.weight+'kg×'+b.reps:'自重', Math.max(...sessionsOf(n).map(s=>s.e1))||'-']; })
    .sort((a,b)=>b[2]-a[2]);
  let md=`# 筋トレ記録サマリー\n\n- 期間: ${ymd(days[0])} 〜 ${ymd(days[days.length-1])}（${rows.length}週）\n- トレーニング日数: ${days.length}日（週平均 ${(days.length/rows.length).toFixed(1)}日）\n- 総セット数: ${recs.length} / 総ボリューム: ${fmtKg(vol)}kg\n- 記録ルール: 1セット1行、ダンベルは片手重量、自重種目は重量なし、ボリューム=重量×回数、推定1RM=重量×(1+回数/30)\n\n## 部位別セット数\n\n| 部位 | セット | 週平均 |\n|---|---:|---:|\n`;
  PARTS.forEach(p=>{ if(parts[p]) md+=`| ${p} | ${parts[p]} | ${(parts[p]/rows.length).toFixed(1)} |\n`; });
  md+=`\n## 週別\n\n| 週開始 | 日数 | セット | ボリュームkg |\n|---|---:|---:|---:|\n`;
  rows.forEach(r=>{ md+=`| ${ymd(r.start)} | ${new Set(r.recs.map(x=>x.date)).size} | ${r.recs.length} | ${fmtKg(r.recs.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0))} |\n`; });
  md+=`\n## 種目別（セッション数順）\n\n| 種目 | 部位 | 回 | 期間初のトップセット | 期間末のトップセット | 自己ベスト | 推定1RM最高 |\n|---|---|---:|---|---|---|---:|\n`;
  exRows.forEach(r=>{ md+='| '+r.join(' | ')+' |\n'; });
  const bs=db.body.filter(b=>b.date>=periodFrom()&&b.date<=todayStr()); if(bs.length){ const a=bs[0],z=bs[bs.length-1]; md+=`\n## 体重\n\n- 期間初: ${a.weight}kg（${ymd(a.date)}） → 期間末: ${z.weight}kg（${ymd(z.date)}）\n- 期間内の最小/最大: ${Math.min(...bs.map(b=>b.weight))} / ${Math.max(...bs.map(b=>b.weight))} kg${z.fat?`\n- 体脂肪率（期間末）: ${z.fat}%`:''}${bmi(z.weight)?`\n- BMI（期間末）: ${bmi(z.weight)}`:''}\n`; }
  return md;
}
function viewAI(){
  return `<div class="card"><p class="small muted" style="margin:0 0 8px">選択中の期間の集計をMarkdownでコピーし、AIに貼って相談する。例：「次の4週間のメニューをどう組むか」「伸びが止まっている種目の原因は」。日別の明細は含まれない。</p><button class="btn primary" onclick="copySummary()">サマリーをコピー</button><textarea class="raw" id="ai-raw" readonly style="margin-top:10px;height:220px">${esc(buildSummary())}</textarea></div>`;
}
async function copySummary(){ const t=buildSummary(); try{ await navigator.clipboard.writeText(t); toast('コピーした'); }catch(e){ const ta=document.getElementById('ai-raw'); ta.focus(); ta.select(); toast('枠内を長押しでコピーしてください'); } }

// ---- 起動 ----
updateBadge(); go('home');
</script>
